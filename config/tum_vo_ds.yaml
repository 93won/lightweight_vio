%YAML:1.0
---
# TUM VI Dataset Configuration for Lightweight VIO - Visual-Inertial Odometry

# System Mode Configuration
# Controls whether to run as VO (Visual Odometry) or VIO (Visual-Inertial Odometry)
system_mode:
  mode: "VO"                    # Options: "VO" or "VIO"

# Viewer Configuration
# Controls 3D visualization using Pangolin
viewer:
  enable: 1                      # Enable/disable 3D viewer (0=false, 1=true)
  width: 1920                    # Viewer window width (pixels)
  height: 1080                   # Viewer window height (pixels)

performance:
  enable_debug_output: 0 # Print debug messages and feature counts

# Camera Parameters (TUM VI dataset specific)
# Image dimensions and processing parameters
camera:
  model: "fisheye_ds"            # Camera model: "pinhole" or "fisheye" or "fisheye_ds"
  type: "stereo"                # ⭐ Camera type: "stereo" or "rgbd" or "monocular"
  image_width: 512            # Image width in pixels (TUM VI standard)
  image_height: 512           # Image height in pixels (TUM VI standard)  
  border_size: 0             # Border size to exclude from feature detection (pixels)
  
  # Left camera (cam0) intrinsics
  left_intrinsics: [156.7849830404922, 156.77017186214402, 254.74830064527453, 256.9426901328605]  # [fx, fy, cx, cy]
  left_distortion: [-0.1805633166495045, 0.5912634233036583]  # [xi, alpha] fisheye_ds
  
  # Right camera (cam1) intrinsics  
  right_intrinsics: [155.77766975566212, 155.7736126280273, 252.43883925813466, 254.8614180390628]  # [fx, fy, cx, cy]
  right_distortion: [-0.18298293455404507, 0.5893967909452626]  # [xi, alpha] fisheye_ds
  
  # Left camera extrinsics (T_BC - camera to body transform)
  left_T_BC: [-0.9995435188897183, 0.028958658611899488, -0.008611035765834088, 0.047306067617976406,
              0.0076083352844395075, -0.034558936868299535, -0.999373700432793, -0.047716618706742264,
              -0.02923811005794607, -0.9989830208636851, 0.03432283418232079, -0.06799664746132071,
              0.0,         0.0,         0.0,         1.0]
  
  # Right camera extrinsics (T_BC - camera to body transform)
  right_T_BC: [-0.9995294505384492, 0.02966702106709694, -0.007793931441206827, -0.05367198428269951,
               0.008165562449681028, 0.012426267155642646, -0.9998894496265359, -0.04600752842208671,
               -0.029566891892557214, -0.9994825940183155, -0.012662667895542833, -0.07152803906440047,
               0.0,         0.0,         0.0,         1.0]

# Keyframe and Windowing Parameters
# Controls keyframe selection and sliding window management
keyframe_management:
  keyframe_window_size: 5
  grid_coverage_ratio: 0.7  # Add keyframe when coverage drops to 70% of last keyframe's coverage
  time_threshold: 0.05

# Feature Detection Parameters
# Controls how corner features are detected using goodFeaturesToTrack
feature_detection:
  max_features: 200          # Maximum number of features to track per frame
  quality_level: 0.1        # Minimum accepted quality of corners (0.01 = 1% of best corner)
  min_distance: 10.0          # Minimum distance between features in pixels (prevents clustering)
  
  # Grid-based feature distribution parameters
  grid_cols: 16             # Number of grid columns for feature distribution
  grid_rows: 16             # Number of grid rows for feature distribution  
  max_features_per_grid: 4   # Maximum features allowed per grid cell

# Optical Flow Tracking Parameters  
# Controls Lucas-Kanade optical flow for feature tracking between frames
optical_flow:
  window_size: 21             # Size of search window (21x21 pixels) for frame-to-frame tracking
  max_level: 3                # Number of pyramid levels (0 = no pyramid, 3 = 4 levels total)
  max_iterations: 30          # Maximum iterations for iterative LK algorithm
  epsilon: 0.01               # Convergence criteria - stop when change < epsilon
  error_threshold: 30.0       # Maximum tracking error to accept a match (pixels)
  max_movement: 100.0         # Maximum pixel movement between frames to accept tracking (pixels)
  min_eigen_threshold: 1e-3   # Minimum eigenvalue threshold for optical flow
  F_threshold: 1.0            # Fundamental matrix RANSAC distance threshold (pixels)

# Stereo Matching Parameters
# Controls stereo correspondence matching between left/right images
# Uses dynamically estimated fundamental matrix for epipolar constraint
stereo_matching:
  # Optical flow parameters for stereo matching (different from frame-to-frame tracking)
  window_size: 31             # Search window size for stereo optical flow (larger for robustness)
  max_level: 4                # Pyramid levels for stereo optical flow (more levels for better matching)
  max_iterations: 50          # Max iterations for stereo optical flow (more for convergence)
  min_eigen_threshold: 1e-4   # Lower eigenvalue threshold for stereo (more permissive)
  
  # Stereo matching thresholds
  error_threshold: 50.0       # Maximum optical flow error for stereo matches (pixels)
  min_disparity: 0.1          # Minimum disparity (pixels) - filters out very far points
  max_disparity: 300.0        # Maximum disparity (pixels) - filters out very close points  
  max_y_difference: 100.0      # Maximum Y-coordinate difference for stereo pairs (pixels)
  epipolar_threshold: 1.0     # Maximum distance from epipolar line using estimated F matrix (pixels)ls)

# Global Depth Parameters
# Controls depth validation throughout the entire VIO system
depth:
  min_depth: 0.3              # Minimum depth for valid 3D points (meters) - used in all depth validation
  max_depth: 100.0             # Maximum depth for valid 3D points (meters) - used in all depth validation

# Optimization Parameters
# Controls Ceres-based optimization behavior for both PnP and Sliding Window
optimization:
  # PnP Optimization Parameters
  pnp_max_iterations: 10               # Maximum optimization iterations for PnP
  # Removed pnp_max_observation_weight - now using logarithmic scaling based on keyframe_window_size

  sliding_window_max_iterations: 10 # Maximum optimization iterations for sliding window
  function_tolerance: 1e-6         # Function tolerance for convergence
  gradient_tolerance: 1e-10        # Gradient tolerance for convergence  
  parameter_tolerance: 1e-8        # Parameter tolerance for convergence
  
  # Robust kernel parameters
  use_robust_kernel: true          # Enable robust kernel for outlier handling (delta=5.991 hardcoded)
  
  # Outlier detection (mainly for PnP)
  enable_outlier_detection: true   # Enable outlier detection
  outlier_detection_rounds: 4      # Number of optimization rounds with outlier detection
  
  # Information weighting parameters - now using logarithmic scaling (saturation_point=20)
  # Removed pnp_max_observation_weight and sliding_window_max_observation_weight

# MapPoint Uncertainty Parameters
# Controls uncertainty propagation for 3D map points
uncertainty:
  enable: 0                  # SUL disabled by default; set to 1 to opt in
  max_eigenvalue: 1e-1       # Maximum covariance matrix eigenvalue
  min_eigenvalue: 1e-5       # Minimum covariance matrix eigenvalue
